name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (build / vet / test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: aegisops
          POSTGRES_USER: aegisops
          POSTGRES_PASSWORD: aegisops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aegisops -d aegisops"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1
        env:
          # 触发 internal/db 的 PostgreSQL 迁移双驱动用例
          # （一次性建删测试库，不触碰业务库；未设置时该用例自动跳过）
          AEGISOPS_TEST_POSTGRES_DSN: postgres://aegisops:aegisops@127.0.0.1:5432/aegisops?sslmode=disable

  frontend:
    name: Frontend (install / build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build
