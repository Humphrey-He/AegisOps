app:
  name: aegisops
  env: dev

http:
  addr: ":8080"

# Prometheus 指标端点：独立端口、无鉴权，只应暴露给内网/监控网络
metrics:
  enabled: true
  addr: ":9091"

database:
  driver: postgres
  dsn: postgres://aegisops:aegisops@127.0.0.1:5432/aegisops?sslmode=disable

security:
  jwt_secret: "change-me-in-production"
  access_token_ttl: 2h
  refresh_token_ttl: 168h
  secret_key: "change-me-32-byte-secret-key!!!!!!"

admin:
  username: admin
  password: admin123456
  email: admin@example.com

notification:
  template_version: v1
  public_base_url: "http://localhost:4173"
