app:
  name: aegisops
  env: dev

http:
  addr: ":8080"

# Prometheus 指标端点：独立端口、无鉴权，只应暴露给内网/监控网络
metrics:
  enabled: true
  addr: ":9091"

database:
  driver: sqlite
  dsn: data/aegisops.db

security:
  jwt_secret: "change-me-in-production"
  access_token_ttl: 2h
  refresh_token_ttl: 168h
  secret_key: "change-me-32-byte-secret-key!!!!!!"

# OIDC SSO（可选，默认关闭）。providers 列表仅支持 YAML 配置。
# auth:
#   oidc:
#     providers:
#       - id: keycloak
#         display_name: 企业账号
#         enabled: true
#         issuer: https://sso.example.com/realms/aegisops
#         client_id: aegisops
#         client_secret: change-me
#         scopes: [openid, profile, email]
#         default_role_code: viewer

admin:
  username: admin
  password: admin123456
  email: admin@example.com

notification:
  template_version: v1
  public_base_url: "http://localhost:4173"
